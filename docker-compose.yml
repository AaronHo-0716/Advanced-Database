services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: glcl-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "${MSSQL_PID:-Developer}"
    ports:
      - "${HOST_PORT:-1433}:1433"
    volumes:
      - glcl_data:/var/opt/mssql

  adminer:
    image: adminer
    container_name: glcl-adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  glcl_data:
